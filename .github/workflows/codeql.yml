name: CodeQL

# On the code it reads (Python and JavaScript): a change to the documentation, to hyperlite-cfs (C, checked by its
# sanitizers and fuzzers in ci.yml) or to the client (Go, govulncheck) does not run it. Every Monday on everything.
on:
  push:
    branches: [master, test]
    paths:
      - "**.py"
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - "**.mjs"
      - "**.cjs"
      - "dashboard/package-lock.json"
      - "requirements*.txt"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.js"
      - "**.jsx"
      - "**.ts"
      - "**.tsx"
      - "**.mjs"
      - "**.cjs"
      - "dashboard/package-lock.json"
      - "requirements*.txt"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
