name: Mirror check

# The public APT mirror, as apt sees it (scripts/verify-apt-mirror.sh): the signed Release and the index files it
# announces must match, or clients fail with "File has unexpected size". It ran as a systemd timer on the dev VM, which
# was removed: a failed run is reported by GitHub to the repository's watchers, and HYPERLITE_ALERT_WEBHOOK (an
# optional repository secret) also gets it. Every publication checks the mirror it has just written
# (scripts/ci-publish.sh): this watches for a later drift (the CDN, the mirror repository), every six hours.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-check
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the mirror
        env:
          HYPERLITE_ALERT_WEBHOOK: ${{ secrets.HYPERLITE_ALERT_WEBHOOK }}
        # A CDN refresh in progress is not a failure: retry for up to 10 minutes.
        run: bash scripts/verify-apt-mirror.sh --wait 600
