name: CI

on:
  push:
    branches: [master, test]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. On master and test nothing is cancelled halfway: each run ends
# with the publication of its commit (the publish job), and a newer commit waits for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The actions are pinned to a commit, not to a tag that can be moved (the version is in the comment, which Dependabot
# keeps up to date): a job of this workflow hands the signing key to the publication.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system packages
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config gcc openssl \
            meson ninja-build libsqlite3-dev libssl-dev libcpg-dev libquorum-dev libvotequorum-dev libcmap-dev
      - name: Install dependencies
        # Two commands: requirements.txt carries hashes, which pip would then demand of the development tools too.
        run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # The shadow mode's tests run against the real hyperlite-cfs too (tests/test_cfs_shadow.py).
      - name: Build hyperlite-cfs
        run: meson setup build-cfs cfs --buildtype=release && ninja -C build-cfs hyperlite-cfs
      - name: Tests
        # One worker per core of the runner (pytest-xdist): the suite took five minutes on one.
        run: HYPERLITE_CFS_BIN=build-cfs/hyperlite-cfs python -m pytest -q -n 4
      - name: Dependency audit
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  cli:
    # The workstation client (cli/): vet, tests, vulnerability check, and a build for
    # every platform the server offers for download.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest stable Go, not the minimum of go.mod: the shipped binaries embed
          # the standard library, so they get its latest security fixes.
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - name: Vulnerability check
        # A fixed version: @latest would run whatever was published last, in the job that checks the supply chain.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build every platform
        working-directory: .
        run: bash installer/build-cli.sh

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check shell scripts
        run: |
          for f in installer/*.sh installer/deb/preinst installer/deb/postinst installer/deb/prerm installer/deb/postrm scripts/*.sh lab/*.sh cfs/tests/cluster/*.sh; do
            bash -n "$f"
          done

  package:
    # What the package ships, built as the publication builds it (installer/build-runtime.sh in debian:13: hyperlite-cfs,
    # the Python environment and its wheels), then checked on Debian 13: dependencies, the daemon, the environment, and
    # its rebuild from the wheels without network (installer/test-package-inside.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the runtime in debian:13
        run: |
          docker run --rm -v "$PWD:/src" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" debian:13 \
            bash /src/installer/build-runtime.sh /src /src/installer/runtime
      - run: bash installer/test-package.sh debian:13 installer/runtime

  cfs:
    # hyperlite-cfs (cfs/), the replicated configuration daemon in C: built with GCC and clang under AddressSanitizer
    # and UndefinedBehaviorSanitizer, its C tests (a simulated cluster included), the Python client against the real
    # daemon, a three-node cluster on a real Corosync in network namespaces (its fault tests and five soak rounds
    # included; the thousand rounds run every night in lab.yml), two-node clusters with and without a QDevice, and
    # fuzzing of the requests and of the messages between nodes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config gcc clang libclang-rt-dev \
            libsqlite3-dev libssl-dev corosync libcpg-dev libquorum-dev libvotequorum-dev libcmap-dev iproute2 \
            corosync-qnetd corosync-qdevice
          # The packages start daemons of their own; the cluster tests run their own, in namespaces.
          sudo systemctl stop corosync corosync-qnetd corosync-qdevice || true
      - name: Build and test (GCC, sanitizers)
        run: |
          meson setup build-gcc cfs -Db_sanitize=address,undefined -Dbuildtype=debug
          ninja -C build-gcc  # meson test builds only what the C tests need, not the daemon the next steps run
          meson test -C build-gcc --print-errorlogs
      - name: Python client against the daemon
        run: |
          pip install pytest==9.1.1
          HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs python -m pytest -q cfs/tests/python
      - name: Three nodes on a real Corosync
        run: |
          sudo env HYPERLITE_CFS_CLUSTER=1 HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs "$(which python)" -m pytest -q \
            -p no:cacheprovider cfs/tests/cluster
      - name: Two nodes, without then with a QDevice
        run: |
          for qdevice in 0 1; do
            sudo env HYPERLITE_CFS_CLUSTER=1 HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs HYPERLITE_LAB_NODES=2 \
              HYPERLITE_LAB_QDEVICE=$qdevice "$(which python)" -m pytest -q -p no:cacheprovider \
              cfs/tests/cluster/test_two_nodes.py
          done
      - name: Fuzz the request handler and the peer messages (clang, libFuzzer, 2 x 45 s)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1  # undefined behaviour stops the run, as a crash does
        run: |
          CC=clang meson setup build-fuzz cfs -Dfuzz=true -Db_sanitize=address,undefined -Db_lundef=false -Dbuildtype=debug
          ninja -C build-fuzz  # meson test builds only the tests, not the fuzz target
          meson test -C build-fuzz --print-errorlogs
          mkdir -p fuzz-work fuzz-work-message
          build-fuzz/fuzz_request -max_total_time=45 -max_len=4096 fuzz-work cfs/fuzz/corpus
          build-fuzz/fuzz_message -max_total_time=45 -max_len=4096 fuzz-work-message cfs/fuzz/corpus-message

  e2e-shard:
    # End-to-end suite against a real backend and a real libvirt/QEMU, in three parts on three runners (each with its
    # own backend): the suite took ten minutes on one, the longest job of the CI by far.
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config gcc openssl \
            libvirt-daemon-system qemu-system-x86 qemu-utils genisoimage wget dnsmasq-base cloud-image-utils libvirt-daemon-driver-lxc ovmf swtpm swtpm-tools
      - name: Enable KVM when the runner exposes it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Start libvirt and the isolated test network
        run: |
          sudo systemctl start libvirtd
          cat > /tmp/isolated.xml <<'XML'
          <network><name>hyperlite-isolated</name><bridge name="virbr-e2e"/><ip address="192.168.199.1" netmask="255.255.255.0"><dhcp><range start="192.168.199.10" end="192.168.199.100"/></dhcp></ip></network>
          XML
          sudo virsh net-define /tmp/isolated.xml
          sudo virsh net-start hyperlite-isolated
      - name: Backend environment
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      - name: Build the dashboard and install browsers
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Replication on a real QEMU VM
        if: matrix.shard == 1
        run: |
          venv/bin/pip install -r requirements-dev.txt
          sudo env HYPERLITE_TEST_LIBVIRT=1 venv/bin/python -m pytest -q -p no:cacheprovider tests/test_replication_qemu.py
      # The first VM created downloads the base cloud image (a few hundred MB): the spec that happened to create it
      # waited past its 60 s hook timeout. Fetched once here, through the backend's own function.
      - name: Fetch the base cloud image
        run: sudo venv/bin/python -c "from app.core.vm_builder import ensure_base_image; print(ensure_base_image())"
      - name: Run the end-to-end suite
        working-directory: dashboard
        env:
          SHARD: ${{ matrix.shard }}
        run: sudo -E env "PATH=$PATH" npx playwright test --shard="$SHARD/3"
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: dashboard/e2e-report
          retention-days: 7

  e2e:
    # The check the branch protection requires: the three parts all passed. A part skipped or cancelled fails it too.
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          test "$RESULT" = success || { echo "::error::the end-to-end suite: $RESULT"; exit 1; }

  publish:
    # Every push to master or test is published once all of the above passed on that very commit.
    needs: [backend, frontend, cli, shell, package, cfs, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test')
    permissions:
      contents: write # the ISO release
    uses: ./.github/workflows/publish.yml
    secrets: inherit
