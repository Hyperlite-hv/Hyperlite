name: CI

# Publication only: the tests are no longer run here (run them locally, CONTRIBUTING.md). Every push to master or test
# is published (.github/workflows/publish.yml: the package, the ISO, the signed APT repository and the mirror); a pull
# request runs nothing.
on:
  push:
    branches: [master, test]

permissions:
  contents: read

# On master and test nothing is cancelled halfway: each run ends with the publication of its commit, and a newer
# commit waits for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # the ISO release
    uses: ./.github/workflows/publish.yml
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
