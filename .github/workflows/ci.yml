name: CI

on:
  push:
    branches: [master, test]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config gcc openssl
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  cli:
    # The workstation client (cli/): vet, tests, vulnerability check, and a build for
    # every platform the server offers for download.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The latest stable Go, not the minimum of go.mod: the shipped binaries embed
          # the standard library, so they get its latest security fixes.
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build every platform
        working-directory: .
        run: bash installer/build-cli.sh

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check shell scripts
        run: |
          for f in installer/*.sh installer/deb/postinst scripts/*.sh lab/*.sh cfs/tests/cluster/*.sh; do
            bash -n "$f"
          done

  cfs:
    # hyperlite-cfs (cfs/), the replicated configuration daemon in C: built with GCC and clang under AddressSanitizer
    # and UndefinedBehaviorSanitizer, its C tests (a simulated cluster included), the Python client against the real
    # daemon, a three-node cluster on a real Corosync in network namespaces, and fuzzing of the requests and of the
    # messages between nodes.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config gcc clang libclang-rt-dev \
            libsqlite3-dev libssl-dev corosync libcpg-dev libquorum-dev iproute2
          # The package starts a Corosync of its own; the cluster test runs its own three, in namespaces.
          sudo systemctl stop corosync || true
      - name: Build and test (GCC, sanitizers)
        run: |
          meson setup build-gcc cfs -Db_sanitize=address,undefined -Dbuildtype=debug
          ninja -C build-gcc  # meson test builds only what the C tests need, not the daemon the next steps run
          meson test -C build-gcc --print-errorlogs
      - name: Python client against the daemon
        run: |
          pip install pytest
          HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs python -m pytest -q cfs/tests/python
      - name: Three nodes on a real Corosync
        run: |
          sudo env HYPERLITE_CFS_CLUSTER=1 HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs "$(which python)" -m pytest -q \
            -p no:cacheprovider cfs/tests/cluster
      - name: Fuzz the request handler and the peer messages (clang, libFuzzer, 2 x 45 s)
        run: |
          CC=clang meson setup build-fuzz cfs -Dfuzz=true -Db_sanitize=address,undefined -Db_lundef=false -Dbuildtype=debug
          ninja -C build-fuzz  # meson test builds only the tests, not the fuzz target
          meson test -C build-fuzz --print-errorlogs
          mkdir -p fuzz-work fuzz-work-message
          build-fuzz/fuzz_request -max_total_time=45 -max_len=4096 fuzz-work cfs/fuzz/corpus
          build-fuzz/fuzz_message -max_total_time=45 -max_len=4096 fuzz-work-message cfs/fuzz/corpus-message

  e2e:
    # End-to-end suite against a real backend and a real libvirt/QEMU.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config gcc openssl \
            libvirt-daemon-system qemu-system-x86 qemu-utils genisoimage wget dnsmasq-base cloud-image-utils libvirt-daemon-driver-lxc ovmf swtpm swtpm-tools
      - name: Enable KVM when the runner exposes it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Start libvirt and the isolated test network
        run: |
          sudo systemctl start libvirtd
          cat > /tmp/isolated.xml <<'XML'
          <network><name>hyperlite-isolated</name><bridge name="virbr-e2e"/><ip address="192.168.199.1" netmask="255.255.255.0"><dhcp><range start="192.168.199.10" end="192.168.199.100"/></dhcp></ip></network>
          XML
          sudo virsh net-define /tmp/isolated.xml
          sudo virsh net-start hyperlite-isolated
      - name: Backend environment
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      - name: Build the dashboard and install browsers
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Replication on a real QEMU VM
        run: |
          venv/bin/pip install -r requirements-dev.txt
          sudo env HYPERLITE_TEST_LIBVIRT=1 venv/bin/python -m pytest -q -p no:cacheprovider tests/test_replication_qemu.py
      - name: Run the end-to-end suite
        working-directory: dashboard
        run: sudo -E env "PATH=$PATH" npx playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: dashboard/e2e-report
          retention-days: 7
