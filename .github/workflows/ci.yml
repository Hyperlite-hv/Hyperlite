name: CI

on:
  push:
    branches: [master, test]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. On master and test nothing is cancelled halfway: each run ends
# with the publication of its commit (the publish job), and a newer commit waits for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The actions are pinned to a commit, not to a tag that can be moved (the version is in the comment, which Dependabot
# keeps up to date): a job of this workflow hands the signing key to the publication.
jobs:
  # How much of this workflow the commit needs (scripts/ci-reuse.sh): `exact` when a push to test or master already
  # passed every check on exactly these files (a release: the test -> master PR and the master push), `docs` when only
  # release files differ from such files (the release PR: the long jobs are not run again), `full` otherwise. A job it
  # skips reports as passed to the branch protection; the e2e gate below accepts a skip only from it. Then which of the
  # long jobs a pull request needs, from the files it changes (scripts/ci-scope.sh): a push needs them all.
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the earlier runs and their jobs
      pull-requests: read # the files a pull request changes
    outputs:
      mode: ${{ steps.reuse.outputs.mode }}
      from: ${{ steps.reuse.outputs.from }}
      e2e: ${{ steps.scope.outputs.e2e }}
      cfs: ${{ steps.scope.outputs.cfs }}
      cli: ${{ steps.scope.outputs.cli }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci-reuse.sh
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-scope.sh

  backend:
    needs: reuse
    if: needs.reuse.outputs.mode != 'exact'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libvirt-dev pkg-config gcc openssl meson ninja-build libsqlite3-dev libssl-dev libcpg-dev libquorum-dev
            libvotequorum-dev libcmap-dev
      - name: Install dependencies
        # Two commands: requirements.txt carries hashes, which pip would then demand of the development tools too.
        run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # The shadow mode's tests run against the real hyperlite-cfs too (tests/test_cfs_shadow.py).
      - name: Build hyperlite-cfs
        run: meson setup build-cfs cfs --buildtype=release && ninja -C build-cfs hyperlite-cfs
      - name: Tests
        # One worker per core of the runner (pytest-xdist): the suite took five minutes on one.
        run: HYPERLITE_CFS_BIN=build-cfs/hyperlite-cfs python -m pytest -q -n 4
      - name: Dependency audit
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt

  frontend:
    needs: reuse
    if: needs.reuse.outputs.mode != 'exact'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  cli:
    # The workstation client (cli/): vet, tests, vulnerability check, and a build for
    # every platform the server offers for download.
    needs: reuse
    if: needs.reuse.outputs.mode == 'full' && needs.reuse.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest stable Go, not the minimum of go.mod: the shipped binaries embed
          # the standard library, so they get its latest security fixes.
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - name: Vulnerability check
        # A fixed version: @latest would run whatever was published last, in the job that checks the supply chain.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build every platform
        working-directory: .
        run: bash installer/build-cli.sh

  shell:
    needs: reuse
    if: needs.reuse.outputs.mode != 'exact'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check shell scripts
        run: |
          for f in installer/*.sh installer/deb/preinst installer/deb/postinst installer/deb/prerm installer/deb/postrm scripts/*.sh lab/*.sh cfs/tests/cluster/*.sh; do
            bash -n "$f"
          done
      # The workflows and actions themselves: a template expanded into a shell, a permission wider than needed, an
      # action pinned to a tag or to a commit outside its repository, a cache a pull request could write.
      - name: Check the workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install -q --require-hashes -r .github/requirements-zizmor.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --config .github/zizmor.yml .github/workflows .github/actions

  package:
    # What the package ships, built as the publication builds it (installer/build-runtime.sh in debian:13: hyperlite-cfs,
    # the Python environment and its wheels), then checked on Debian 13: dependencies, the daemon, the environment, and
    # its rebuild from the wheels without network (installer/test-package-inside.sh).
    needs: reuse
    if: needs.reuse.outputs.mode == 'full' && needs.reuse.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What apt and pip downloaded in the containers last time (installer/build-cache.sh): both check every kept file
      # against what they trust (the signed Debian index, the hashes of requirements.txt), so a pull request reads it
      # safely; only pushes write it. A new key each month lets Debian's updates in without keeping old files forever.
      - id: key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.package-downloads
          key: package-${{ steps.key.outputs.month }}-${{ hashFiles('installer/build-runtime.sh', 'installer/test-package-inside.sh', 'installer/deb/control.template', 'requirements.txt') }}
          restore-keys: package-${{ steps.key.outputs.month }}-
      - name: Build the runtime in debian:13
        run: |
          mkdir -p ~/.package-downloads
          docker run --rm -v "$PWD:/src" -v "$HOME/.package-downloads:/cache" -e HYPERLITE_BUILD_CACHE=/cache \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" debian:13 bash /src/installer/build-runtime.sh /src /src/installer/runtime
      - run: HYPERLITE_BUILD_CACHE="$HOME/.package-downloads" bash installer/test-package.sh debian:13 installer/runtime
      - if: steps.downloads.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: sudo chown -R "$(id -u):$(id -g)" ~/.package-downloads
      - if: steps.downloads.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.package-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}

  cfs:
    # hyperlite-cfs (cfs/), the replicated configuration daemon in C: built with GCC and clang under AddressSanitizer
    # and UndefinedBehaviorSanitizer, its C tests (a simulated cluster included), the Python client against the real
    # daemon, and fuzzing of the requests and of the messages between nodes (the two fuzzers side by side). Its
    # clusters on a real Corosync run in cfs-cluster below.
    needs: reuse
    if: needs.reuse.outputs.mode == 'full' && needs.reuse.outputs.cfs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install system packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            meson ninja-build pkg-config gcc clang libclang-rt-dev libsqlite3-dev libssl-dev corosync libcpg-dev
            libquorum-dev libvotequorum-dev libcmap-dev iproute2 corosync-qnetd corosync-qdevice
      # The packages start daemons of their own; the cluster tests run their own, in namespaces.
      - run: sudo systemctl stop corosync corosync-qnetd corosync-qdevice || true
      - name: Build and test (GCC, sanitizers)
        run: |
          meson setup build-gcc cfs -Db_sanitize=address,undefined -Dbuildtype=debug
          ninja -C build-gcc  # meson test builds only what the C tests need, not the daemon the next steps run
          meson test -C build-gcc --print-errorlogs
      - name: Python client against the daemon
        run: |
          pip install pytest==9.1.1
          HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs python -m pytest -q cfs/tests/python
      - name: Fuzz the request handler and the peer messages (clang, libFuzzer, 45 s each, side by side)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1  # undefined behaviour stops the run, as a crash does
        run: |
          CC=clang meson setup build-fuzz cfs -Dfuzz=true -Db_sanitize=address,undefined -Db_lundef=false -Dbuildtype=debug
          ninja -C build-fuzz  # meson test builds only the tests, not the fuzz target
          meson test -C build-fuzz --print-errorlogs
          mkdir -p fuzz-work fuzz-work-message
          build-fuzz/fuzz_request -max_total_time=45 -max_len=4096 fuzz-work cfs/fuzz/corpus > fuzz-request.log 2>&1 &
          request=$!
          build-fuzz/fuzz_message -max_total_time=45 -max_len=4096 fuzz-work-message cfs/fuzz/corpus-message \
            > fuzz-message.log 2>&1 &
          message=$!
          status=0
          wait "$request" || { status=1; echo "::error::fuzz_request found a crash"; }
          wait "$message" || { status=1; echo "::error::fuzz_message found a crash"; }
          tail -n 40 fuzz-request.log fuzz-message.log
          exit "$status"

  cfs-cluster:
    # hyperlite-cfs on a real Corosync in network namespaces: three nodes (its fault tests and five soak rounds
    # included; the thousand rounds run every night in lab.yml), and two nodes without then with a QDevice. On two
    # runners: together they took three of the six minutes of the cfs job.
    name: cfs-cluster (${{ matrix.part }})
    needs: reuse
    if: needs.reuse.outputs.mode == 'full' && needs.reuse.outputs.cfs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [three nodes, two nodes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install system packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            meson ninja-build pkg-config gcc libsqlite3-dev libssl-dev corosync libcpg-dev libquorum-dev
            libvotequorum-dev libcmap-dev iproute2 corosync-qnetd corosync-qdevice
      # The packages start daemons of their own; the cluster tests run their own, in namespaces.
      - run: sudo systemctl stop corosync corosync-qnetd corosync-qdevice || true
      - name: Build (GCC, sanitizers)
        run: |
          meson setup build-gcc cfs -Db_sanitize=address,undefined -Dbuildtype=debug
          ninja -C build-gcc hyperlite-cfs
          pip install pytest==9.1.1
      - name: Three nodes on a real Corosync
        if: matrix.part == 'three nodes'
        run: |
          sudo env HYPERLITE_CFS_CLUSTER=1 HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs "$(which python)" -m pytest -q \
            -p no:cacheprovider cfs/tests/cluster --ignore=cfs/tests/cluster/test_two_nodes.py
      - name: Two nodes, without then with a QDevice
        if: matrix.part == 'two nodes'
        run: |
          for qdevice in 0 1; do
            sudo env HYPERLITE_CFS_CLUSTER=1 HYPERLITE_CFS_BIN=build-gcc/hyperlite-cfs HYPERLITE_LAB_NODES=2 \
              HYPERLITE_LAB_QDEVICE=$qdevice "$(which python)" -m pytest -q -p no:cacheprovider \
              cfs/tests/cluster/test_two_nodes.py
          done

  e2e-shard:
    # End-to-end suite against a real backend and a real libvirt/QEMU, in four parts on four runners (each with its
    # own backend): the suite took ten minutes on one, the longest job of the CI by far.
    name: e2e (${{ matrix.shard }}/4)
    needs: reuse
    if: needs.reuse.outputs.mode == 'full' && needs.reuse.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard dependencies
        working-directory: dashboard
        run: npm ci
      # The system libraries Chromium needs that this runner image lacks, installed with the rest: `playwright install
      # --with-deps` ran apt again, from the mirror every time.
      - id: browser
        name: The browser's system libraries
        working-directory: dashboard
        run: |
          deps=$(npx playwright install-deps --dry-run chromium | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | tr '\n' ' ')
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "key=playwright-$ImageOS-$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Install system packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libvirt-dev pkg-config gcc openssl libvirt-daemon-system qemu-system-x86 qemu-utils genisoimage wget
            dnsmasq-base cloud-image-utils libvirt-daemon-driver-lxc ovmf swtpm swtpm-tools libnbd-bin python3-libnbd
            ${{ steps.browser.outputs.deps }}
      - name: Enable KVM when the runner exposes it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Start libvirt and the isolated test network
        run: |
          sudo systemctl start libvirtd
          cat > /tmp/isolated.xml <<'XML'
          <network><name>hyperlite-isolated</name><bridge name="virbr-e2e"/><ip address="192.168.199.1" netmask="255.255.255.0"><dhcp><range start="192.168.199.10" end="192.168.199.100"/></dhcp></ip></network>
          XML
          sudo virsh net-define /tmp/isolated.xml
          sudo virsh net-start hyperlite-isolated
      - name: Backend environment
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      # Chromium, downloaded once per Playwright version; written by pushes only, as the packages are.
      - id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.key }}
      - name: Install the browser
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: dashboard
        run: npx playwright install chromium
      - if: steps.chromium.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.key }}
      - name: Build the dashboard
        working-directory: dashboard
        run: npm run build
      - name: Replication on a real QEMU VM
        if: matrix.shard == 1
        run: |
          venv/bin/pip install -r requirements-dev.txt
          sudo env HYPERLITE_TEST_LIBVIRT=1 venv/bin/python -m pytest -q -p no:cacheprovider tests/test_replication_qemu.py
      - name: Backups into a backup store on a real QEMU VM
        if: matrix.shard == 1
        run: |
          sudo bash scripts/ensure-backup-apparmor.sh
          sudo env HYPERLITE_TEST_LIBVIRT=1 venv/bin/python -m pytest -q -p no:cacheprovider tests/test_backup_store_qemu.py
      - name: A migration between clusters on real disks
        if: matrix.shard == 1
        run: sudo env HYPERLITE_TEST_LIBVIRT=1 venv/bin/python -m pytest -q -p no:cacheprovider tests/test_site_transfer_qemu.py
      # The first VM created downloads the base cloud image (a few hundred MB): the spec that happened to create it
      # waited past its 60 s hook timeout. Fetched once here, through the backend's own function.
      - name: Fetch the base cloud image
        run: sudo venv/bin/python -c "from app.core.vm_builder import ensure_base_image; print(ensure_base_image())"
      - name: Run the end-to-end suite
        working-directory: dashboard
        env:
          SHARD: ${{ matrix.shard }}
        run: sudo -E env "PATH=$PATH" npx playwright test --shard="$SHARD/4"
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: dashboard/e2e-report
          retention-days: 7

  e2e:
    # The check the branch protection requires for the long jobs: the end-to-end parts, hyperlite-cfs, its clusters,
    # the package and the client all passed, or were skipped either by the reuse (these files, or files that differ
    # from them only in release files, already passed them) or because this pull request changes none of their files
    # (scripts/ci-scope.sh). Anything else fails it: a job failed, cancelled, or skipped for another reason (the reuse
    # job itself failed). Named e2e as the branch protection knows it; it covers the other long jobs too, which no
    # required check covered (a red cfs or package did not block a merge).
    needs: [reuse, e2e-shard, cfs, cfs-cluster, package, cli]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          REUSE: ${{ needs.reuse.result }}
          MODE: ${{ needs.reuse.outputs.mode }}
          FROM: ${{ needs.reuse.outputs.from }}
          E2E: ${{ needs.e2e-shard.result }} ${{ needs.reuse.outputs.e2e }}
          CFS: ${{ needs.cfs.result }} ${{ needs.reuse.outputs.cfs }}
          CFS_CLUSTER: ${{ needs.cfs-cluster.result }} ${{ needs.reuse.outputs.cfs }}
          PACKAGE: ${{ needs.package.result }} ${{ needs.reuse.outputs.package }}
          CLI: ${{ needs.cli.result }} ${{ needs.reuse.outputs.cli }}
        run: |
          status=0
          check() { # <job> <result> <needed by this pull request's files>
            [ "$2" = success ] && return 0
            if [ "$2" = skipped ] && [ "$REUSE" = success ]; then
              if [ "$MODE" = exact ] || [ "$MODE" = docs ]; then
                echo "::notice::$1 not run again ($MODE): passed on ${FROM:0:12}"
                return 0
              fi
              if [ "${3:-}" = false ]; then
                echo "::notice::$1 not needed: this pull request changes none of its files"
                return 0
              fi
            fi
            echo "::error::$1: $2"
            status=1
          }
          # Word splitting on purpose: each variable is "<result> <needed>".
          check "the end-to-end suite" $E2E
          check cfs $CFS
          check cfs-cluster $CFS_CLUSTER
          check package $PACKAGE
          check cli $CLI
          exit "$status"

  publish:
    # Every push to master or test is published once all of the above passed on that very commit, or on its very files
    # (reuse: the e2e gate accepted the skip). A failed or cancelled job stops it.
    needs: [reuse, backend, frontend, cli, shell, package, cfs, cfs-cluster, e2e]
    if: >-
      always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test')
      && needs.reuse.result == 'success' && needs.e2e.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write # the ISO release
    uses: ./.github/workflows/publish.yml
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
