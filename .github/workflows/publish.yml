name: Publish

# Builds the package and the ISO, signs the APT repository, publishes it to the mirror and updates the
# ISO release. All the logic is in scripts/ci-publish.sh.
#
# It publishes every push to master, the stable channel, and to test, the test channel (docs/design/updates-1.0.md,
# section 7; no ISO for test), once the CI has passed on that very commit: ci.yml calls it after all its jobs. It used
# to start next to the CI, so a merge whose result the CI then failed (the branch protection does not ask a pull
# request to be up to date with its base) was published anyway. It also runs by hand. The version is stamped into the
# artifacts, nothing is committed back, so it cannot trigger itself. The signing key and the mirror deploy key are
# secrets of the `release` environment, which only master and test may use: a pull request never reaches them.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      skip_iso:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and check everything without pushing to the mirror or the release"
        type: boolean
        default: true
      skip_iso:
        description: "Do not build the ISO"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A newer commit on the branch publishes after its own CI: this one would only be overwritten, or published after
  # it with a newer version stamp. No secrets here.
  tip:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tip="$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BRANCH has moved on to ${tip:0:8}: ${SHA:0:8} is not published, the newer commit will be"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: tip
    if: needs.tip.outputs.current == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test')
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write # the ISO release
    # One publication at a time, whatever the branch: both push to the same mirror. Never cancelled halfway.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      ISO: ${{ github.ref_name == 'master' && !inputs.skip_iso }}
    steps:
      # The commit the CI passed, not whatever the branch points to by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest stable Go, not the minimum of go.mod: the shipped binaries embed
          # the standard library, so they get its latest security fixes.
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils rsync gnupg openssl
      - name: Install the ISO tools
        if: env.ISO == 'true'
        run: sudo apt-get install -y --no-install-recommends xorriso isolinux syslinux-utils cpio genisoimage
      - name: Install the dashboard dependencies
        working-directory: dashboard
        run: npm ci
      # 744 MB: only the ISO needs it.
      - name: Cache the Debian installer image
        if: env.ISO == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: installer/.iso-cache
          key: debian-netinst-${{ hashFiles('installer/build-iso.sh') }}
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --list-secret-keys --keyid-format long | grep -c '^sec' | sed 's/^/secret keys imported: /'
      - name: Prepare the credentials of the mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # Either a deploy key (preferred: limited to the mirror repository, no expiry) or a fine-grained
          # token limited to it. Neither ever appears on a command line or in a URL.
          if [ -n "$MIRROR_DEPLOY_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_deploy_key
            chmod 600 ~/.ssh/mirror_deploy_key
            {
              echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/mirror_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
              echo "HYPERLITE_MIRROR_REPO=git@github.com:Hyperlite-hv/hyperlite-hv.github.io.git"
            } >> "$GITHUB_ENV"
          elif [ -n "$MIRROR_TOKEN" ]; then
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w0)"
            echo "::add-mask::$header"
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
              echo "GIT_CONFIG_VALUE_0=$header"
            } >> "$GITHUB_ENV"
          else
            echo "::error::No credentials for the mirror: add the environment secret MIRROR_DEPLOY_KEY (or MIRROR_TOKEN)"
            exit 1
          fi
      - name: Publish
        env:
          HYPERLITE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SKIP_ISO: ${{ env.ISO == 'true' && '0' || '1' }}
          HYPERLITE_CHANNEL: ${{ github.ref_name == 'test' && 'test' || 'stable' }}
        run: bash scripts/ci-publish.sh
      - name: Remove the secrets from the runner
        if: always()
        run: |
          rm -f ~/.ssh/mirror_deploy_key
          rm -rf "$RUNNER_TEMP/gnupg"
