# The Terminal's tmux (docs/design/workbench.md): the server outlives its clients, so a dropped connection or an
# update of Hyperlite re-attaches to the same shell.
set -g exit-empty off
set -g exit-unattached off
set -g status off
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g default-command "bash -l"
set -g mouse off
set -g escape-time 10
# The shell exited: the box ends with it.
set-hook -g session-closed 'kill-server'
