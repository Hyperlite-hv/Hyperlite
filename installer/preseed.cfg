# Debian preseed for the bootable Hyperlite installer ("Hyperlite Appliance").
# Fully automates a Debian (netinst) installation, then chains into
# postinstall.sh (see d-i preseed/late_command below), which installs
# KVM/libvirt + Hyperlite and configures the network bridge.
#
# WARNING: this preseed ERASES the disk(s) of the target machine without asking
# for confirmation (deliberate choice: a Proxmox-style automatic install).

# WARNING: "priority=critical" as a kernel parameter is NOT enough on its own.
# It only feeds the GENERIC question-skipping mechanism (based on the priority
# threshold), but the two most destructive partman confirmations
# (partman/confirm and partman-lvm/confirm, "write the changes to the disk(s)")
# do their OWN manual check by reading the debconf/priority question directly,
# which the kernel parameter alone never sets. Confirmed by inspecting
# /var/lib/cdebconf/questions.dat live on an installer stuck on that screen:
# "Name: debconf/priority" exists but WITHOUT any "Value:" line. As a result
# partman/confirm and partman-lvm/confirm stayed blocked indefinitely despite
# "d-i partman-lvm/confirm boolean true" preseeded below (flagged "seen" in
# the database at the very moment the screen was shown: the value WAS there,
# but partman ignores it for these two specific confirmations). Hence this
# line, needed in addition to the kernel parameter, not instead of it.
d-i debconf/priority string critical

### Localization
# language/country/locale: all three, even though /locale alone would suffice
# in theory, because localechooser handles them as distinct internal questions
# (redundant with the same values already passed as kernel parameters, see
# build-iso.sh, but harmless to repeat here). These are the appliance defaults.
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr

### Network
# DHCP on the first detected interface; never blocks the installation if no
# link is found (unlike the default d-i behaviour, which may stay stuck
# waiting for a cable/DHCP).
d-i netcfg/choose_interface select auto
d-i netcfg/link_detection_timeout string 10
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 30
d-i netcfg/get_hostname string hyperlite
d-i netcfg/get_domain string local
d-i netcfg/hostname string hyperlite
d-i netcfg/wireless_wep string

### Clock / time zone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Package management (CD-ROM + mirror)
# set-first/set-next/set-failed set to false: never offer to scan an
# additional medium (otherwise the "Scan another CD or DVD?" screen stays
# displayed and blocks the installation).
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### User account
# No standard user account: root only (consistent with how Hyperlite is
# operated, as root).
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# The root password is NOT preseeded: the installer asks for it (like the Proxmox
# installer). passwd/root-login stays true; passwd/make-user stays false.

### Partitioning
# The choice between RAID1 (2+ disks) and plain LVM (1 disk), as well as the
# exact list of disks, is decided dynamically by partman-auto.sh (see
# preseed/include_command below), which generates these values from the
# hardware actually detected. Only what is common to both cases is set here.
# WARNING: preseed/include_command proved unreliable for providing
# partman-auto/method in time: the "Partition disks / Partitioning method"
# screen stayed displayed and blocked even though the fragment generated by
# partman-auto.sh was syntactically correct. The plain LVM value (a single
# disk, by far the most common case, i.e. a single physical server) is
# therefore set HERE, statically, in addition to the dynamic mechanism.
# KNOWN LIMITATION: in preseeding, a question already answered by an earlier
# load (this one, loaded from the initrd) is normally NOT overwritten by a
# value preseeded later (include_command). On a machine with 2+ disks this
# static "lvm" value is therefore likely to WIN over the "raid" that
# partman-auto.sh would try to provide, so the RAID mode of that script is
# probably BROKEN by this change and must be retested for real before relying
# on it. With a single disk this static value is enough, and partman-auto/disk
# does not need to be specified (d-i picks the only eligible disk by itself).
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

### Base packages
tasksel tasksel/first multiselect standard, ssh-server
# libvirt-daemon-driver-lxc: needed for the Containers tab (libvirt-daemon-system
# does NOT pull it in as a dependency).
# pkg-config + libvirt-dev + build-essential + python3-dev: required to build
# libvirt-python (no prebuilt wheel for this Python/platform combination);
# pip otherwise fails with "pkg-config binary is required to compile
# libvirt-python".
# curl + gnupg + ca-certificates: required to add the Hyperlite APT repository
# (key + source, see postinstall.sh). No git/nodejs/npm: the frontend is
# shipped already built in the .deb package (see installer/build-deb.sh), so
# npm is needed on the target machine neither to install nor to update.
# nfs-common + nfs-kernel-server: required for NFS (netfs) storage pools, the
# foundation of live migration. nfs-common (client, mount.nfs) is mandatory on
# ANY node that mounts a remote netfs pool; nfs-kernel-server lets a node export
# a directory itself. Both are installed everywhere but the server is NOT
# enabled by default (the service stays disabled until an /etc/exports is
# configured, so no network surface is exposed needlessly).
d-i pkgsel/include string openssh-server sudo curl ca-certificates gnupg python3 python3-venv python3-pip python3-dev pkg-config build-essential libvirt-dev qemu-kvm qemu-utils libvirt-daemon-system libvirt-daemon-driver-lxc libvirt-clients bridge-utils genisoimage sshpass cloud-image-utils debootstrap skopeo umoci xorriso nfs-common nfs-kernel-server
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### End of installation
d-i finish-install/reboot_in_progress note

### Hooks
# include_command (NOT early_command): its standard output is re-read as an
# additional preseed fragment, the normal file-loading mechanism, which accepts
# values for components that are not loaded yet (e.g. partman-auto), unlike a
# direct db_set from early_command, which fails as long as the owning
# component does not exist in the debconf database yet ("question doesn't
# exist", tested and confirmed).
# Generates the partitioning strategy (RAID1+LVM or plain LVM) from the
# hardware actually detected.
d-i preseed/include_command string /cdrom/hyperlite/partman-auto.sh

# late_command: post-installation entry point, run chrooted in the freshly
# installed system (see postinstall.sh).
d-i preseed/late_command string \
    in-target mkdir -p /root/hyperlite-installer; \
    cp -r /cdrom/hyperlite/* /target/root/hyperlite-installer/; \
    in-target bash /root/hyperlite-installer/postinstall.sh
