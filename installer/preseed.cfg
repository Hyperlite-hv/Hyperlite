# Preseed Debian pour l'installeur bootable Hyperlite ("Hyperlite Appliance").
# Automatise entierement une installation Debian (netinst) puis enchaine sur
# postinstall.sh (voir d-i preseed/late_command plus bas) qui installe
# KVM/libvirt + Hyperlite et configure le bridge reseau -- meme principe que
# les preseed/kickstart deja construits dans ce projet pour les VM invitees,
# applique cette fois a la machine hote elle-meme.
#
# ATTENTION : ce preseed EFFACE le(s) disque(s) de la machine cible sans
# demander de confirmation (choix explicite : "Automatique facon Proxmox").

# ATTENTION (bug reel trouve en testant plusieurs vrais boots, reproduit de
# facon fiable, pas un hasard) : "priority=critical" en parametre noyau ne
# suffit PAS a lui seul. C'est un raccourci qui informe le mecanisme
# GENERIQUE de saut de questions (base sur le seuil de priorite), mais les
# deux confirmations les plus destructrices de partman (partman/confirm et
# partman-lvm/confirm -- "ecrire les modifications sur le(s) disque(s)")
# font leur PROPRE verification manuelle en lisant directement la valeur de
# la question debconf/priority -- jamais definie par le simple parametre
# noyau, confirme en inspectant /var/lib/cdebconf/questions.dat en direct
# sur un installeur bloque sur cet ecran : "Name: debconf/priority" existe
# mais SANS aucune ligne "Value:". Resultat : partman/confirm et
# partman-lvm/confirm restaient bloques indefiniment malgre
# "d-i partman-lvm/confirm boolean true" deja preseede plus bas (marque
# "Flags: seen" dans la base au moment meme ou l'ecran etait affiche --
# la valeur ETAIT bien la, mais partman l'ignore pour ces deux
# confirmations precises). D'ou cette ligne, necessaire en plus du
# parametre noyau, pas a la place.
d-i debconf/priority string critical

### Localisation
# language/country/locale : les trois, meme si /locale seul suffirait en
# theorie -- localechooser les traite comme des questions internes
# distinctes (redondant avec les memes valeurs deja passees en parametre
# noyau, voir build-iso.sh, mais sans risque a repeter ici).
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr

### Reseau
# DHCP sur la premiere interface detectee ; ne bloque jamais l'installation
# si aucun lien n'est trouve (contrairement au comportement par defaut de d-i
# qui peut rester bloque a attendre un cable/DHCP).
d-i netcfg/choose_interface select auto
d-i netcfg/link_detection_timeout string 10
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 30
d-i netcfg/get_hostname string hyperlite
d-i netcfg/get_domain string local
d-i netcfg/hostname string hyperlite
d-i netcfg/wireless_wep string

### Horloge / fuseau horaire
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Gestion des paquets (CD-ROM + miroir)
# set-first/set-next/set-failed a false : ne jamais proposer de scanner un
# support supplementaire (ecran "Faut-il analyser d'autres supports
# d'installation ?" sinon laisse affiche et bloque -- bug reel trouve en
# testant un vrai boot).
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Compte utilisateur
# Pas de compte utilisateur standard : root uniquement (coherent avec le
# fonctionnement actuel de Hyperlite sur kvm-lab, deja opere en root).
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# ATTENTION (bug reel trouve en testant un vrai boot) : mis a l'origine dans
# le fragment preseed genere DYNAMIQUEMENT par partman-auto.sh (via
# preseed/include_command, voir plus bas) plutot qu'ici, en pensant que ce
# mecanisme couvrait tout composant "pas encore charge" -- vrai pour
# partman-auto/* (confirme, ca fonctionne), FAUX pour passwd/user-setup :
# son propre udeb n'est recupere par l'installeur qu'ENCORE PLUS TARD,
# apres que le fichier d'include_command a deja ete consomme, donc ces deux
# valeurs etaient silencieusement ignorees -- l'ecran "Creer les
# utilisateurs et choisir les mots de passe" restait affiche et bloque,
# champ vide, malgre priority=critical. Le mot de passe root est fixe
# ("hyperlite", pas aleatoire -- demande explicite d'Antho, simple pour une
# premiere connexion, a changer immediatement apres) : aucune raison de le
# generer dynamiquement, contrairement a partman-auto/disk qui depend du
# materiel reellement detecte. Preseede donc ici, statiquement, comme le
# reste de ce fichier.
d-i passwd/root-password password hyperlite
d-i passwd/root-password-again password hyperlite

### Partitionnement
# Le choix RAID1 (2+ disques) vs LVM simple (1 disque), ainsi que la liste
# exacte des disques, est decide dynamiquement par partman-auto.sh (voir
# preseed/include_command plus bas) qui genere ces valeurs selon le materiel
# reellement detecte. On ne fixe ici que ce qui est commun aux deux cas.
# ATTENTION (bug reel trouve en testant un vrai boot) : preseed/include_command
# s'est avere peu fiable pour fournir partman-auto/method a temps -- l'ecran
# "Partitionner les disques / Methode de partitionnement" restait affiche et
# bloque malgre un fragment genere par partman-auto.sh syntaxiquement correct.
# La valeur LVM simple (cas d'un seul disque, largement le plus courant --
# un serveur physique unique) est donc fixee ICI, statiquement, en plus du
# mecanisme dynamique. CONSEQUENCE A CONNAITRE, pas juste "non teste" : en
# preseeding, une question deja repondue par un chargement precedent (celui-
# ci, charge des l'initrd) n'est normalement PAS re-ecrasee par une valeur
# preseedee plus tard (include_command). Sur une machine a 2+ disques, cette
# valeur statique "lvm" a donc de bonnes chances de l'EMPORTER sur le "raid"
# que partman-auto.sh tenterait de fournir -- le mode RAID de ce script est
# probablement CASSE par ce changement, pas simplement pas re-verifie. A
# retester reellement avant de compter sur le mode RAID ; sur un seul disque
# (cas actuel d'Antho), cette valeur statique suffit et partman-auto/disk
# n'a pas besoin d'etre precise explicitement (d-i selectionne seul l'unique
# disque eligible).
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

### Paquets de base
tasksel tasksel/first multiselect standard, ssh-server
# pkg-config + libvirt-dev + build-essential + python3-dev : requis pour
# compiler libvirt-python (pas de wheel precompile disponible pour cette
# combinaison Python/plateforme) -- pip echoue sinon avec "pkg-config binary
# is required to compile libvirt-python" (rencontre et confirme en test).
d-i pkgsel/include string openssh-server sudo curl ca-certificates gnupg git python3 python3-venv python3-pip python3-dev pkg-config build-essential libvirt-dev qemu-kvm qemu-utils libvirt-daemon-system libvirt-clients bridge-utils genisoimage sshpass cloud-image-utils debootstrap skopeo umoci xorriso
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Fin d'installation
d-i finish-install/reboot_in_progress note

### Hooks
# include_command (PAS early_command) : sa sortie standard est relue comme
# un fragment de preseed supplementaire -- le mecanisme normal de chargement
# de fichier, qui accepte des valeurs pour des composants pas encore charges
# (ex. partman-auto), contrairement a un db_set direct depuis early_command
# qui echoue tant que le composant proprietaire n'existe pas encore dans la
# base debconf ("question doesn't exist", teste et confirme en pratique).
# Genere la strategie de partitionnement (RAID1+LVM ou LVM simple) selon le
# materiel reellement detecte, et le mot de passe root aleatoire.
d-i preseed/include_command string /cdrom/hyperlite/partman-auto.sh

# late_command : point d'entree post-installation, execute chroote dans le
# systeme fraichement installe -- voir postinstall.sh.
# Le mot de passe root genere par partman-auto.sh vit dans le tmpfs de
# l'environnement live (/tmp) : il faut le copier sur le disque cible AVANT
# le chroot (in-target), sinon il disparait avec l'environnement live.
d-i preseed/late_command string \
    in-target mkdir -p /root/hyperlite-installer; \
    cp -r /cdrom/hyperlite/* /target/root/hyperlite-installer/; \
    cp /tmp/hyperlite-root-password /target/root/hyperlite-installer/hyperlite-root-password; \
    in-target bash /root/hyperlite-installer/postinstall.sh
