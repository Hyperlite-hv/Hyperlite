# Debian preseed for the bootable Hyperlite installer: the part common to both modes.
#
# build-iso.sh appends preseed-auto.cfg or preseed-custom.cfg and embeds the result in the initrd of the matching
# boot menu entries (see there). The language, the country, the locale and, in automatic mode, the keyboard,
# the host name and the time zone come from the kernel command line of each entry: the first screens are shown
# before this file is read.
#
# Both modes install without a network: the installer lays the base system from the CD and postinstall.sh
# installs everything else from the ISO (installer/build-offline-bundle.sh).

### Network
# DHCP on the first detected interface. Without an answer, the installer asks for the address, the gateway and
# the DNS server (the node must be reachable from its first boot): no network is needed to install.
d-i netcfg/choose_interface select auto
d-i netcfg/link_detection_timeout string 10
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 30
# Without a DHCP answer: straight to the manual configuration (address, gateway, DNS), in both modes. At the
# automatic mode's priority the installer would otherwise skip these questions and leave the node unreachable.
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configure network manually
d-i netcfg/wireless_wep string

### Clock / time zone
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Package management: the CD-ROM only, no network mirror
# The installation needs no network, as with Proxmox: the installer puts the base system from the CD, and
# postinstall.sh installs everything else from the packages carried by the ISO (installer/build-offline-bundle.sh).
# postinstall.sh then writes the Debian sources the machine updates from.
# set-first/set-next/set-failed set to false: never offer to scan an
# additional medium (otherwise the "Scan another CD or DVD?" screen stays
# displayed and blocks the installation).
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean true

### User account
# No standard user account: root only (consistent with how Hyperlite is
# operated, as root).
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# The root password is NOT preseeded: the installer asks for it (like the Proxmox
# installer). passwd/root-login stays true; passwd/make-user stays false.

### Base packages
# None from the installer: the list is installer/packages.list, installed by postinstall.sh from the ISO (the
# "standard" and "ssh-server" tasks included). Without a mirror, a task or an upgrade here would need the network.
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
# UEFI: grub also goes to the fallback path (EFI/BOOT/BOOTX64.EFI), so the node boots on firmware that loses or
# ignores its boot entries.
d-i grub-installer/force-efi-extra-removable boolean true

### End of installation
# Debian's "Installation complete" screen is answered: the custom mode shows its own (hyperlite-questions.sh),
# which also says to remove the installation media; the automatic mode restarts by itself.
d-i finish-install/reboot_in_progress note
# late_command: post-installation entry point. The installation files are copied to the new system, the
# keyboard chosen in the installer is written for it, the custom mode asks its questions (hyperlite-questions.sh, nothing in automatic mode), postinstall.sh runs chrooted in the
# new system, then the custom mode shows how to reach the dashboard.
d-i preseed/late_command string \
    in-target mkdir -p /root/hyperlite-installer; \
    cp -r /cdrom/hyperlite/* /target/root/hyperlite-installer/; \
    sh /cdrom/hyperlite/hyperlite-questions.sh keyboard; \
    sh /cdrom/hyperlite/hyperlite-questions.sh ask; \
    in-target bash /root/hyperlite-installer/postinstall.sh; \
    sh /cdrom/hyperlite/hyperlite-questions.sh done
