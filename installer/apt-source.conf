# Single source of truth for where Hyperlite is distributed: the APT repository and the ISO download.
#
# Every script that needs it reads this file: the ISO build (embedded for the installed appliance),
# the post-install script, the mirror check and the publishing hook. To move the repository (a new
# GitHub owner, another host), change this one line, publish, and see docs/deployment.md.
HYPERLITE_APT_URL="https://hyperlite-hv.github.io"
# The Git repository whose gh-pages branch is served at the address above. The publishing hook pushes
# the generated APT repository there.
HYPERLITE_MIRROR_REPO="https://github.com/Hyperlite-hv/hyperlite-hv.github.io.git"
# Previous mirrors that still receive every publication during a migration, so machines that have
# not switched yet keep updating. Space separated; empty when no machine uses an old address.
HYPERLITE_LEGACY_MIRROR_REPOS=""
# The ISO is published once, as the moving GitHub release `appliance-iso-latest`, next to its
# SHA-256 sum and signature. README.md and docs/deployment.md must link to exactly this address.
HYPERLITE_ISO_URL="https://github.com/Hyperlite-hv/Hyperlite/releases/download/appliance-iso-latest/hyperlite-appliance-amd64.iso"
