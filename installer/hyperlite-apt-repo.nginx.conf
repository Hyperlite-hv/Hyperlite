# Sert le depot APT Hyperlite directement, sans CDN intermediaire --
# chantier "apt install comme Proxmox", corrige le 2026-09-17 apres avoir
# trouve et confirme (30 essais sur 10+ minutes, verifie depuis serveur-
# antho ET depuis kvm-lab, incoherence encore presente 1h20+ apres la
# derniere publication) que le depot public GitHub Pages ne garantit PAS
# une coherence forte entre InRelease et Packages : un CDN multi-nœuds,
# pas une origine atomique. Voir CLAUDE.md pour l'analyse complete.
#
# Installation sur kvm-lab (une seule fois) :
#   apt-get install -y nginx-light
#   ln -sf /root/hyperlite/installer/hyperlite-apt-repo.nginx.conf /etc/nginx/sites-available/hyperlite-apt-repo
#   ln -sf /etc/nginx/sites-available/hyperlite-apt-repo /etc/nginx/sites-enabled/hyperlite-apt-repo
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl restart nginx && systemctl enable nginx
#
# Lie UNIQUEMENT a l'IP Tailscale de kvm-lab (jamais expose sur l'internet
# public) : accessible depuis toute machine sur ce meme reseau Tailscale
# (serveur-antho, les appliances qu'Antho deploie lui-meme), pas depuis
# l'exterieur.
server {
    listen 100.88.184.24:8899;
    server_name hyperlite-apt-repo;

    root /root/hyperlite/installer/apt-repo;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # ISO d'installation de l'appliance (build-iso.sh) -- fichier unique
    # expose explicitement plutot que d'autoindexer tout installer/ (qui
    # contient aussi le cache de build deb-build/), meme reseau Tailscale
    # que le depot APT ci-dessus.
    location = /hyperlite-appliance-amd64.iso {
        alias /root/hyperlite/installer/hyperlite-appliance-amd64.iso;
    }
}
