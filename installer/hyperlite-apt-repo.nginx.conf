# Serves the Hyperlite APT repository directly, with no CDN in between. The
# public GitHub Pages mirror does NOT guarantee strong consistency between
# InRelease and Packages (multi-node CDN, not an atomic origin), which makes
# `apt update` fail intermittently; a single origin avoids it.
#
# Installation (once):
#   apt-get install -y nginx-light
#   cp /root/hyperlite/installer/hyperlite-apt-repo.nginx.conf /etc/nginx/sites-available/hyperlite-apt-repo
#   ln -sf /etc/nginx/sites-available/hyperlite-apt-repo /etc/nginx/sites-enabled/hyperlite-apt-repo
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl restart nginx && systemctl enable nginx
#
# Edit the copy in /etc/nginx to set the listen address. Bind it ONLY to a
# private address (VPN/LAN interface of the build machine), never to a public
# one unless you intend to publish the repository on the internet.
server {
    listen 127.0.0.1:8899;
    server_name hyperlite-apt-repo;

    root /root/hyperlite/installer/apt-repo;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Appliance installation ISO (build-iso.sh): a single file exposed
    # explicitly rather than autoindexing the whole installer/ directory (which
    # also contains the deb-build/ build cache).
    location = /hyperlite-appliance-amd64.iso {
        alias /root/hyperlite/installer/hyperlite-appliance-amd64.iso;
    }
}
