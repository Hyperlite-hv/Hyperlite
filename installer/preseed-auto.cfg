### Automatic installation: appended to preseed.cfg by build-iso.sh
# It asks two things only: the root password, then one confirmation that names the disk(s) it is about to erase.
# Everything else is answered here or on the kernel command line (language, keyboard, host name, time zone).

# "priority=critical" as a kernel parameter is NOT enough on its own: it only feeds the generic question-skipping
# mechanism, while partman reads debconf/priority itself for its confirmations. Inspecting
# /var/lib/cdebconf/questions.dat on an installer stuck on such a screen showed "Name: debconf/priority" without
# any value. Hence this line, in addition to the kernel parameter.
d-i debconf/priority string critical

d-i netcfg/get_hostname string hyperlite
d-i netcfg/get_domain string local
d-i netcfg/hostname string hyperlite

### Partitioning
# The disk comes from partman-auto.sh, run when the partitioner starts (partman/early_command): the first internal
# disk, never a removable one such as the installation stick. The CD is mounted by then, which it is not when this
# file is read from the initrd.
#
# The confirmation that writes the disk is NOT answered: partman-lvm/confirm (a disk with partitions) or
# partman-lvm/confirm_nooverwrite (an empty disk), which names the disk. The final partman/confirm comes after the
# disk was already written, so it is answered.
d-i partman/early_command string sh /cdrom/hyperlite/partman-auto.sh
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

### Bootloader
d-i grub-installer/bootdev string default
