### Custom installation: appended to preseed.cfg by build-iso.sh
# The installer guides every choice: keyboard, host name and domain, network (DHCP or by hand), root password,
# time zone, disk and layout (LVM with ext4 by default, or manual partitioning), with a confirmation before
# anything is written. hyperlite-questions.sh then asks for the password of the dashboard's admin account and,
# optionally, where to send the alerts by email. The defaults below are proposed, not imposed ("seen false").

d-i netcfg/get_hostname string hyperlite
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string local
d-i netcfg/get_domain seen false

### Partitioning
# Proposed: the whole disk with LVM (the space left in the volume group can hold VM disks). The other guided
# methods and manual partitioning stay one choice away.
d-i partman-auto/init_automatically_partition select some_device_lvm
d-i partman-auto/init_automatically_partition seen false
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/choose_recipe seen false
