<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperlite</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>HYPERLITE</h1>
      <p class="subtitle">Gestion d'infrastructure virtualisee</p>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Utilisateur" autocomplete="username" required>
        <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password" required>
        <button type="submit">Connexion</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app-screen" class="screen" style="display:none">
    <header>
      <div class="brand">HYPERLITE</div>
      <nav>
        <button class="nav-btn active" data-view="dashboard">Tableau de bord</button>
        <button class="nav-btn" data-view="vms">Machines virtuelles</button>
        <button class="nav-btn" data-view="storage">Stockage</button>
        <button class="nav-btn" data-view="network">Reseau</button>
      </nav>
      <div class="user-info">
        <span id="user-label"></span>
        <span id="role-badge" class="role-badge"></span>
        <button id="logout-btn">Deconnexion</button>
      </div>
    </header>

    <main>
      <section id="view-dashboard" class="view active">
        <div class="view-header"><h2>Tableau de bord</h2></div>
        <div class="cards" id="dashboard-cards"></div>
      </section>

      <section id="view-vms" class="view">
        <div class="view-header">
          <h2>Machines virtuelles</h2>
          <button id="create-vm-btn" class="btn-primary admin-only">+ Creer une VM</button>
        </div>
        <table class="data-table">
          <thead>
            <tr><th>Nom</th><th>Etat</th><th>vCPU</th><th>Memoire</th><th>IP</th><th>Actions</th></tr>
          </thead>
          <tbody id="vms-tbody"></tbody>
        </table>
      </section>

      <section id="view-storage" class="view">
        <div class="view-header"><h2>Stockage</h2></div>
        <div id="storage-pools"></div>
      </section>

      <section id="view-network" class="view">
        <div class="view-header"><h2>Reseaux virtuels</h2></div>
        <div id="networks-list"></div>
      </section>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal-content"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
